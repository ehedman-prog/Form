<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles/normalize.css">
    <link rel="stylesheet" href="styles/index.css">
</head>

<body>

    <section class="contact-form">
        <form action="">

            <label for="name">FULL NAME</label>
            <input type="text" id="name" placeholder="Your Name" required>

            <label for="email">EMAIL</label>
            <input type="email" id="email" placeholder="Your Email" required>

            <label for="topic">MESSAGE REGARDING</label>
            <select name="topic" id="topic" required>
                <option value="">Please choose an option</option>
                <option value="general">General inquiry</option>
                <option value="support">Product support</option>
                <option value="feedback">Feedback</option>
            </select>

            <label for="message">YOUR MESSAGE</label>
            <textarea name="YOUR MESSAGE" id="message" cols="30" rows="10" required></textarea>

            <label for="privacy">By submitting this form, I agree to the [Privacy Policy]</label>
            <input type="checkbox" id="privacy" required>

            <label for="subscribe">Sign me up for the newsletter</label>
            <input type="checkbox" id="subscribe">

            <button type="submit">SEND MESSAGE</button>

        </form>
    </section>

</body>
</html>
